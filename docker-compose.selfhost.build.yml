# Development override: build the backend/web images from the current checkout
# instead of pulling the official GHCR images.

services:
  docs:
    image: multica-docs:dev
    build:
      context: .
      dockerfile: Dockerfile.docs
    restart: unless-stopped

  backend:
    image: multica-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}

  frontend:
    image: multica-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: dev
    depends_on:
      - backend
      - docs
    environment:
      DOCS_URL: http://docs:4000
